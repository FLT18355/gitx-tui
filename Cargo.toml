[package]
name = "gitx-tui"
version = "0.1.6"
edition = "2024"
rust-version = "1.88"
description = "A terminal GitHub workspace for repositories, stars and releases"
license = "MIT"
repository = "https://github.com/FLT18355/gitx-tui"

[[bin]]
name = "gxt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["parsing"] }
toml = "1.1"
unicode-width = "0.2"
ureq = { version = "3.5", features = ["json"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
